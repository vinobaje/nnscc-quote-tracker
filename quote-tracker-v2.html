<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Waterview Condominium — Contractor Quote Tracker</title>
<style>
:root {
  --paper:#F7F8F9; --card:#FFFFFF; --ink:#1E2833; --ink2:#4A5866; --muted:#7A8794;
  --line:#D9DEE3; --line-soft:#E8ECEF;
  --accent:#2D567F; --accent-ink:#24466B; --accent-soft:#EAF0F6;
  --good:#1E7A46; --good-soft:#E7F3EC; --prio:#A03636; --prio-soft:#F7ECEC;
  --amber:#B0700F; --amber-soft:#F8EFDD; --bar:#2D567F;
}
:root[data-theme="dark"], :root[data-theme="light"] {
  --paper:#F7F8F9; --card:#FFFFFF; --ink:#1E2833; --ink2:#4A5866; --muted:#7A8794;
  --line:#D9DEE3; --line-soft:#E8ECEF;
  --accent:#2D567F; --accent-ink:#24466B; --accent-soft:#EAF0F6;
  --good:#1E7A46; --good-soft:#E7F3EC; --prio:#A03636; --prio-soft:#F7ECEC;
  --amber:#B0700F; --amber-soft:#F8EFDD; --bar:#2D567F;
}
html { background:var(--paper); color-scheme:light; }
body { font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
  background:var(--paper); margin:0; padding:0 20px 64px; }
.wrap { max-width:960px; margin:0 auto; }
h1,h2 { font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-weight:600; text-wrap:balance; }
h1 { font-size:30px; line-height:1.2; margin:0 0 4px; }
h2 { font-size:21px; margin:0 0 4px; color:var(--ink); }
.kicker { text-transform:uppercase; letter-spacing:.14em; font-size:11.5px; color:var(--accent-ink); font-weight:600; }
section > .kicker { display:inline-block; background:var(--accent-soft); border-radius:99px; padding:3px 11px; margin-bottom:6px; }
header.rep { padding:30px 0 20px; border-top:4px solid var(--accent); border-bottom:3px double var(--line); margin-top:14px; margin-bottom:26px; }
.meta { color:var(--ink2); font-size:14px; margin-top:6px; }
.rephead { display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; }
.logochip { background:#232B36; border-radius:8px; padding:10px 18px; flex:none; }
.logochip img { height:58px; display:block; }
.banner { margin:18px 0 0; }
.banner img { width:100%; height:215px; object-fit:cover; border-radius:8px;
  border:1px solid var(--line); display:block; }
@media (max-width:640px) { .banner img { height:150px; } .logochip img { height:44px; } }
section { margin:34px 0; }
.seclede { color:var(--ink2); font-size:14px; max-width:64ch; margin:2px 0 14px; }

/* ---------- app bar (screen only) ---------- */
html { scroll-behavior:smooth; }
.appbar { position:sticky; top:0; z-index:30; background:linear-gradient(90deg,#1B2634 0%,#25405E 100%);
  box-shadow:0 2px 12px rgba(15,22,31,.35); margin:0 -20px; }
.appbar-inner { max-width:960px; margin:0 auto; padding:9px 20px; display:flex; gap:8px;
  align-items:center; flex-wrap:wrap; }
.appbrand { display:flex; align-items:center; gap:9px; font-family:Georgia,serif; font-size:15.5px;
  font-weight:600; color:#fff; margin-right:10px; white-space:nowrap; }
.appbrand img { height:24px; display:block; }
.appbar .spacer { flex:1; }
.appbar .btn { background:rgba(255,255,255,.08); color:#E8EEF5; border:1px solid rgba(255,255,255,.22);
  transition:background .15s; }
.appbar .btn:hover { background:rgba(255,255,255,.18); filter:none; }
.appbar .btn.on { background:#fff; color:#24466B; border-color:#fff; }
.appbar .seg { border-color:rgba(255,255,255,.28); }
.barnote { font-size:12px; color:rgba(255,255,255,.65); }
.menu { position:relative; }
.dropdown { position:absolute; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line);
  border-radius:8px; box-shadow:0 10px 30px rgba(20,26,33,.22); min-width:210px; padding:6px;
  display:none; flex-direction:column; z-index:40; }
.menu.open .dropdown { display:flex; }
.dropdown button { font:600 13px -apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  background:none; border:none; text-align:left; padding:9px 12px; border-radius:6px; cursor:pointer; }
.dropdown button:hover { background:var(--accent-soft); }
.dropdown button.ddanger { color:var(--prio); }
.dropdown button.ddanger:hover { background:var(--prio-soft); }

/* ---------- hero header & section nav ---------- */
.hero { position:relative; border-radius:10px; overflow:hidden; margin-top:20px; min-height:250px;
  display:flex; align-items:flex-end; box-shadow:0 6px 24px rgba(20,26,33,.16); }
.hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero::after { content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(18,28,40,.15) 0%, rgba(14,22,32,.82) 100%); }
.hero-content { position:relative; z-index:2; padding:26px 28px; width:100%; display:flex;
  justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.hero h1 { color:#fff; font-size:32px; margin:2px 0 4px; text-shadow:0 1px 8px rgba(0,0,0,.35); }
.herokick { color:#BFD5EA; font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:11.5px; }
.herometa { color:rgba(255,255,255,.88); font-size:13.5px; }
.secnav { display:flex; gap:6px; flex-wrap:wrap; position:sticky; top:var(--abh, 48px); z-index:20;
  background:var(--paper); margin:14px -20px 4px; padding:10px 20px;
  box-shadow:0 6px 12px -8px rgba(20,26,33,.18); }
.secnav a { font-size:12.5px; font-weight:600; color:var(--accent-ink); text-decoration:none;
  background:var(--card); border:1px solid var(--line); border-radius:99px; padding:6px 13px;
  transition:background .15s, color .15s; }
.secnav a:hover { background:var(--accent-soft); }
.secnav a.active { background:var(--accent); border-color:var(--accent); color:#fff; }
#report section { scroll-margin-top:calc(var(--abh, 48px) + 58px); }
.editable-head { cursor:text; transition:outline-color .12s; }
.editable-head:hover { outline:1px dashed var(--accent); outline-offset:5px; border-radius:4px; }
.editable-head:focus { outline:2px solid var(--accent); outline-offset:5px; border-radius:4px; }
.edithint-inline { font-size:13px; color:var(--accent-ink); background:var(--accent-soft);
  border-radius:6px; padding:7px 12px; margin:12px 0 0; }
.old-toolbar-spacer { display:none; }
.btn { font:600 13px/1 -apple-system,"Segoe UI",Roboto,sans-serif; color:var(--accent-ink);
  background:var(--accent-soft); border:1px solid var(--line); border-radius:6px; padding:8px 13px;
  cursor:pointer; white-space:nowrap; }
.btn:hover { filter:brightness(.97); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.ghost { background:transparent; }
.btn.danger { color:var(--prio); background:var(--prio-soft); }
.seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg .btn { border:none; border-radius:0; background:transparent; }
.seg .btn.on { background:var(--accent); color:#fff; }
.savenote { font-size:12px; color:var(--muted); }

/* ---------- summary tiles ---------- */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:20px 0 8px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
.tile, .card, .group, .tablewrap, .chart { box-shadow:0 1px 3px rgba(30,40,51,.06); transition:box-shadow .18s, transform .18s; }
.tile { border-top:3px solid var(--accent); }
.tile.hp { border-top-color:var(--prio); } .tile.sv { border-top-color:var(--good); } .tile.pd { border-top-color:var(--amber); }
.tile:hover { box-shadow:0 6px 18px rgba(30,40,51,.13); transform:translateY(-2px); }
.card:hover, .group:hover, .tablewrap:hover { box-shadow:0 4px 14px rgba(30,40,51,.10); }
tbody tr:not(.bidrow):not(.subtotal):hover td { background:rgba(45,86,127,.05); }
.tile .v { font-size:23px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.tile .l { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
.tile.hp .v { color:var(--prio); } .tile.sv .v { color:var(--good); } .tile.pd .v { color:var(--amber); }

/* ---------- tables ---------- */
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
  font-weight:600; padding:10px 14px 8px; border-bottom:1px solid var(--line); }
td { padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
tbody tr:last-child td { border-bottom:none; }
td.num { color:var(--muted); width:2.2em; }
.money, td.money, th.money { text-align:right; white-space:nowrap; }
tr.subtotal td { border-top:2px solid var(--line); font-weight:650; background:var(--accent-soft); }
.fn { display:block; font-size:12.5px; color:var(--muted); }
.bids { display:inline-block; font-size:11px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft);
  border-radius:99px; padding:1px 8px; white-space:nowrap; }
.bids.expand { cursor:pointer; user-select:none; }
.bids.expand::after { content:" ▾"; font-size:10px; }
.bids.expand.open::after { content:" ▴"; }
.bids.expand:hover, .bids.expand:focus-visible { background:var(--accent); color:#fff; outline:none; }
tr.bidrow > td { padding:0; background:var(--accent-soft); border-bottom:1px solid var(--line); }
.bidrow-inner { padding:8px 12px 12px; }
.bidrow-inner table.cmp { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.low { display:inline-block; font-size:11.5px; font-weight:650; color:var(--good); background:var(--good-soft);
  border-radius:99px; padding:1px 8px; white-space:nowrap; }
.prio { display:inline-block; font-size:11px; font-weight:650; color:var(--prio); background:var(--prio-soft);
  border-radius:99px; padding:1px 8px; white-space:nowrap; }
.pendchip { display:inline-block; font-size:11.5px; font-weight:650; color:var(--amber); background:var(--amber-soft);
  border-radius:99px; padding:1px 8px; white-space:nowrap; }

.card { background:var(--card); border:1px solid var(--line); border-radius:6px; margin:12px 0; overflow:hidden; }
.cardhead { padding:11px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.jobno { font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-ink); }
.cmp td, .cmp th { font-size:14px; }
tr.pend td { color:var(--muted); font-style:italic; }

.group { background:var(--card); border:1px solid var(--line); border-radius:6px; margin:12px 0; overflow:hidden; }
.grouphead { display:flex; justify-content:space-between; gap:12px; padding:10px 14px; font-weight:650;
  border-bottom:1px solid var(--line); background:var(--accent-soft); font-size:14.5px; }
.sched td { font-size:14px; }

.chart { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 18px; }
.brow { display:grid; grid-template-columns:190px 1fr 150px; gap:10px; align-items:center; padding:3.5px 0; }
.blabel { font-size:13px; color:var(--ink2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btrack { height:16px; background:var(--line-soft); border-radius:0 4px 4px 0; }
.bar { height:100%; background:var(--bar); border-radius:0 4px 4px 0; min-width:2px; }
.bval { font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.bjobs { color:var(--muted); }
@media (max-width:640px) { .brow { grid-template-columns:120px 1fr 120px; } }

ul.notes { margin:8px 0 0; padding-left:20px; color:var(--ink2); font-size:14px; }
ul.notes li { margin:5px 0; }
.foot { margin-top:40px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; max-width:75ch; }
.foot p { margin:4px 0; }

/* ---------- editor ---------- */
#editor { display:none; }
body[data-view="edit"] #editor { display:block; }
body[data-view="edit"] #report { display:none; }
.ecard { background:var(--card); border:1px solid var(--line); border-radius:6px; margin:12px 0;
  box-shadow:0 1px 3px rgba(30,40,51,.06); overflow:hidden; }
.ecard.isprio { border-left:4px solid var(--prio); }
.ehead { display:flex; gap:10px; align-items:center; padding:10px 12px; background:var(--accent-soft);
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
.ehead .desc { flex:1; min-width:200px; }
.draghandle { cursor:grab; color:var(--muted); font-size:17px; line-height:1; padding:2px 4px; user-select:none; }
.draghandle:active { cursor:grabbing; }
.movebtns { display:inline-flex; flex-direction:column; }
.mvbtn { border:1px solid var(--line); background:var(--card); color:var(--ink2); cursor:pointer;
  font-size:9px; line-height:1; padding:2px 5px; }
.mvbtn:first-child { border-radius:5px 5px 0 0; border-bottom:none; }
.mvbtn:last-child { border-radius:0 0 5px 5px; }
.mvbtn:hover { background:var(--accent-soft); color:var(--accent-ink); }
.jnbadge { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px;
  padding:0 6px; background:var(--accent); color:#fff; border-radius:6px; font-size:13px; font-weight:650;
  font-variant-numeric:tabular-nums; }
.ecard.isprio .jnbadge { background:var(--prio); }
.ecard.dragging { opacity:.5; }
.ecard.dragover { outline:2px dashed var(--accent); outline-offset:2px; }
.echk { display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink2); white-space:nowrap; }
input[type=text], input[type=number], select {
  font:14px -apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:5px; padding:6px 8px; }
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.ebids { padding:6px 12px 10px; overflow-x:auto; }
.ebrow { display:grid; grid-template-columns:minmax(150px,1.4fr) 90px 120px 110px minmax(120px,1.6fr) 96px 30px;
  gap:8px; align-items:center; padding:5px 0; min-width:740px; }
.ebrow.hdr { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; }
.ebrow .st { font-size:12px; font-weight:650; white-space:nowrap; }
.st.rec { color:var(--good); } .st.pen { color:var(--amber); font-style:italic; }
.xbtn { border:none; background:none; color:var(--prio); font-size:16px; cursor:pointer; line-height:1; padding:2px 6px; }
.addbid { font-size:13px; font-weight:600; color:var(--accent-ink); background:none; border:none; cursor:pointer; padding:8px 12px 10px; }
.edithint { color:var(--ink2); font-size:14px; max-width:70ch; margin:14px 0; }
.esettings .ebids { padding:10px 14px 14px; }
.esrow { display:grid; grid-template-columns:180px 1fr; gap:10px; align-items:center; padding:4px 0; }
.esrow label { font-size:12.5px; color:var(--ink2); font-weight:600; text-align:right; }
.esrow textarea { font:13.5px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  border:1px solid var(--line); border-radius:5px; padding:7px 9px; width:100%; box-sizing:border-box; resize:vertical; }
.esrow textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.ainarr { font-style:normal; border-left:3px solid var(--accent); padding-left:12px; }
@media (max-width:560px) { .esrow { grid-template-columns:1fr; } .esrow label { text-align:left; } }

/* ---------- PIN modal ---------- */
.overlay { position:fixed; inset:0; background:rgba(20,26,33,.45); z-index:50;
  display:none; align-items:center; justify-content:center; }
.overlay.open { display:flex; }
.pinbox { background:var(--card); border:1px solid var(--line); border-radius:8px;
  box-shadow:0 12px 40px rgba(20,26,33,.25); padding:22px 24px; width:min(360px, 90vw); }
.pinbox h3 { margin:0 0 4px; font:600 17px Georgia,serif; }
.pinbox p { margin:4px 0 14px; font-size:13.5px; color:var(--ink2); }
.pinbox p.warn { color:var(--prio); font-weight:600; }
.pinbox input { width:100%; box-sizing:border-box; font-size:20px; letter-spacing:.35em;
  text-align:center; padding:9px; }
.pinbox .err { color:var(--prio); font-size:13px; min-height:18px; margin:8px 0 2px; }
.pinbox .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.histbox { width:min(560px, 92vw); }
.histlist { max-height:min(420px, 60vh); overflow-y:auto; margin:10px 0 4px; }
.histentry { border-top:1px solid var(--line-soft); padding:9px 2px; }
.histentry:first-child { border-top:none; }
.histwho { font-size:12.5px; font-weight:650; color:var(--accent-ink); }
.histwhen { font-size:12px; color:var(--muted); font-weight:400; }
.histentry ul { margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--ink2); }
.histentry li { margin:2px 0; }
.histempty { color:var(--muted); font-size:13.5px; }

@media print {
  :root { --paper:#fff; --card:#fff; }
  body { padding:0; font-size:12.5px; }
  .appbar, .secnav, .edithint-inline, #editor { display:none !important; }
  #report { display:block !important; }
  .editable-head { outline:none !important; }
  /* Every section begins on a fresh page (summary stays with the letterhead),
     so a heading can never be orphaned at the bottom of a page. */
  #report section { break-before:page; margin-top:0; padding-top:8px; }
  #report section#secSum { break-before:auto; }
  /* Large containers may flow across pages — rows never split, headers repeat. */
  .tablewrap, .group { break-inside:auto; border-color:#bbb; box-shadow:none; }
  tr { break-inside:avoid; }
  thead { display:table-header-group; }
  .card,.tile,.chart { break-inside:avoid; border-color:#bbb; box-shadow:none; }
  h2, section > .kicker, .seclede, .grouphead, .cardhead { break-after:avoid; }
  .logochip { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  header.rep { padding-top:0; margin-top:0; }
  /* hero prints as a classic letterhead: photo and dark overlay dropped, ink text */
  .hero { min-height:0; margin-top:0; border-radius:0; overflow:visible; box-shadow:none;
    border-top:4px solid var(--accent); border-bottom:3px double #bbb; display:block; }
  .hero-img, .hero::after { display:none !important; }
  .hero-content { padding:10px 0 14px; }
  .hero h1 { color:var(--ink); text-shadow:none; }
  .herokick { color:var(--accent-ink); }
  .herometa { color:var(--ink2); }
  .tile:hover { transform:none; }
}
</style>

/* short label for the floating nav pills: heading up to the first dash/comma, capped */
function shortLabel(s) {
  s = String(s || "").split("—")[0].split(" - ")[0].split(",")[0].trim();
  if (s.length <= 30) return s;
  var cut = s.slice(0, 29);
  var sp = cut.lastIndexOf(" ");
  return (sp > 12 ? cut.slice(0, sp) : cut).trim() + "…";
}
function genId() { return "j" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
/* Keep jobs in priority-first order (preserving the board's chosen order within each
   class, since Array.sort is stable), then number them 1..N by report position. */
function orderJobs(arr) {
  arr.sort(function (a, b) { return (b.priority ? 1 : 0) - (a.priority ? 1 : 0); });
  arr.forEach(function (j, i) { j.no = i + 1; });
}

  if (!s || !Array.isArray(s.jobs)) s = JSON.parse(JSON.stringify(seed));
  s.meta = Object.assign({}, META_DEFAULTS, s.meta || {});
  s.ai = (s.ai && s.ai.summary) ? s.ai : null;
  s.jobs.forEach(function (j) { if (!j.id) j.id = genId(); });   /* stable identity for history */

var lastSaved = null;   /* baseline for diffing; set after load/sync/save */
function bidLabel(b) { return (b.contractor || "unnamed contractor").trim() || "unnamed contractor"; }
function amtLabel(b) {
  if (b.amount == null || b.amount === "") return "pending";
  return money(Number(b.amount)) + (b.hst ? " (HST incl.)" : " (+HST)");
}
var META_LABELS = { title: "report title", condoName: "condominium name", regNo: "registration number",
  manager: "management company", buildings: "buildings line",
  headSum: "summary heading", headA: "Section A heading", headB: "Section B heading",
  headC: "Section C heading", headD: "Section D heading", headE: "Section E heading" };
function diffStates(oldS, newS) {
  var out = [];
  if (!oldS) return out;
  var om = oldS.meta || {}, nm = newS.meta || {};
  Object.keys(META_LABELS).forEach(function (k) {
    if ((om[k] || "") !== (nm[k] || ""))
      out.push("Report settings: " + META_LABELS[k] + " changed to “" + (nm[k] || "") + "”");
  });
  var oa = oldS.ai || null, na = newS.ai || null;
  if (!oa && na) out.push("AI narrative added to the report");
  else if (oa && !na) out.push("AI narrative removed from the report");
  else if (oa && na && JSON.stringify(oa) !== JSON.stringify(na))
    out.push("AI narrative updated");
  var oldBy = {}, newBy = {};
  oldS.jobs.forEach(function (j) { oldBy[j.id] = j; });
  newS.jobs.forEach(function (j) { newBy[j.id] = j; });
  oldS.jobs.forEach(function (j) {
    if (!(j.id in newBy)) out.push("Deleted job " + j.no + " (" + j.desc + ")");
  });
  newS.jobs.forEach(function (j) {
    var o = oldBy[j.id];
    if (!o) { out.push("Added job " + j.no + " (" + (j.desc || "no description") + ")"); return; }
    var tag = "Job " + j.no + " (" + (j.desc || o.desc) + "): ";
    if (o.desc !== j.desc) out.push(tag + "description changed to “" + j.desc + "”");
    if (!!o.priority !== !!j.priority) out.push(tag + "priority set to " + (j.priority ? "High" : "Standard"));
    var oldBids = o.bids.slice();
    j.bids.forEach(function (b) {
      var idx = -1;
      for (var i = 0; i < oldBids.length; i++) {
        if (bidLabel(oldBids[i]).toLowerCase() === bidLabel(b).toLowerCase()) { idx = i; break; }
      }
      if (idx < 0) { out.push(tag + "added bid — " + bidLabel(b) + ", " + amtLabel(b)); return; }
      var ob = oldBids.splice(idx, 1)[0];
      if (String(ob.amount) !== String(b.amount) || !!ob.hst !== !!b.hst)
        out.push(tag + bidLabel(b) + " quote " + amtLabel(b) + " (was " + amtLabel(ob) + ")");
      if ((ob.notes || "") !== (b.notes || "")) out.push(tag + bidLabel(b) + " notes updated");
      if (String(ob.qno || "") !== String(b.qno || "")) out.push(tag + bidLabel(b) + " quote # updated");
    });
    oldBids.forEach(function (ob) { out.push(tag + "removed bid — " + bidLabel(ob)); });
  });
  return out;
}

function persist(msg, explicitChanges) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  var changes = explicitChanges || diffStates(lastSaved, state);
  lastSaved = deepCopy(state);
  cloudPush(changes);
  var n = document.getElementById("saveNote");
  n.textContent = msg || ((cloud.user ? "Saved to cloud · " : "Saved in this browser · ") +
                          new Date().toLocaleTimeString());
  clearTimeout(persist._t); persist._t = setTimeout(function(){ n.textContent = ""; }, 4000);
}

      ? "⚠ This Google account isn’t authorized to edit — changes kept in this browser only"
      : "⚠ Cloud save failed (" + code + ") — changes kept in this browser");

}
function cloudSignIn(then) {
  if (!cloud.on) { then(); return; }           /* offline copy: edit locally */
  if (cloud.user) { then(); return; }
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())

    .catch(function (e) {

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function money(v) { return "$" + Number(v).toLocaleString("en-CA",
  { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function todayStr() { return new Date().toLocaleDateString("en-CA",
  { year: "numeric", month: "long", day: "numeric" }); }

function bidTotal(b) {
  if (b.amount == null || b.amount === "" || isNaN(b.amount)) return null;
  var a = Number(b.amount);
  return b.hst ? a : Math.round(a * (1 + HST) * 100) / 100;
}

/* derived facts for one job */
function jobCalc(j) {
  var bids = j.bids.map(function (b) { return { b: b, total: bidTotal(b) }; });
  var priced = bids.filter(function (x) { return x.total != null; });
  var minT = priced.length ? Math.min.apply(null, priced.map(function (x) { return x.total; })) : null;
  bids.forEach(function (x) {
    x.pending = (x.total == null && (x.b.contractor || "").trim() !== "");
    x.lowest = priced.length > 1 && x.total === minT;
    x.carried = x.total != null && (priced.length === 1 || x.lowest);
  });
  var carriedBids = bids.filter(function (x) { return x.carried; });
  var cost = carriedBids.reduce(function (s, x) { return s + x.total; }, 0);
  var alt = bids.filter(function (x) { return x.total != null && !x.carried; })
                .map(function (x) { return x.total; });
  var saving = alt.length ? Math.max(0, Math.min.apply(null, alt) - cost) : 0;
  return { bids: bids, priced: priced.length, cost: cost, carriedBids: carriedBids,
           saving: Math.round(saving * 100) / 100,
           pendingNames: bids.filter(function (x) { return x.pending; })
                             .map(function (x) { return x.b.contractor; }) };
}

function computeAll() {
  var jobs = state.jobs.map(function (j) { var c = jobCalc(j); return { j: j, c: c }; });
  var hp = jobs.filter(function (x) { return x.j.priority; });
  var nhp = jobs.filter(function (x) { return !x.j.priority; });
  var total = jobs.reduce(function (s, x) { return s + x.c.cost; }, 0);
  var hpTotal = hp.reduce(function (s, x) { return s + x.c.cost; }, 0);
  var savings = jobs.reduce(function (s, x) { return s + x.c.saving; }, 0);
  var pendingCount = jobs.reduce(function (s, x) { return s + x.c.pendingNames.length; }, 0);
  var roll = {};
  jobs.forEach(function (x) { x.c.carriedBids.forEach(function (cb) {
    var nm = (cb.b.contractor || "—").trim() || "—";
    if (!roll[nm]) roll[nm] = { n: 0, tot: 0 };
    roll[nm].n++; roll[nm].tot += cb.total;
  }); });
  return { jobs: jobs, hp: hp, nhp: nhp, total: total, hpTotal: hpTotal,
           savings: savings, pendingCount: pendingCount, roll: roll };
}

/* ---------- report rendering ---------- */
function badge(x) { return x.j.bids.length > 1
  ? ' <span class="bids expand" role="button" tabindex="0" title="Show the competing quotes">' +
    x.j.bids.length + " bids</span>" : ""; }

/* rows of one job's quote comparison — shared by Section B and the inline expansions */
function cmpRows(x) {
  var r = [];
  x.c.bids.forEach(function (cb) {
    if (!(cb.b.contractor || "").trim() && cb.total == null) return;
    if (cb.total == null) {
      r.push('<tr class="pend"><td>' + esc(cb.b.contractor) + "</td><td>" + (esc(cb.b.notes) || "—") +
             '</td><td class="money">Quote pending</td><td></td></tr>');
    } else {
      r.push("<tr><td>" + esc(cb.b.contractor) + "</td><td>" + (esc(cb.b.notes) || "—") +
             '</td><td class="money">' + money(cb.total) + "</td><td>" +
             (cb.lowest ? '<span class="low">✓ Lowest</span>' : "") + "</td></tr>");
    }
  });
  return r.join("");
}
function bidRowHTML(x, colspan) {
  if (x.j.bids.length < 2) return "";
  return '<tr class="bidrow" hidden><td colspan="' + colspan + '"><div class="bidrow-inner">' +
    '<table class="cmp"><thead><tr><th>Contractor</th><th>Scope note</th>' +
    '<th class="money">Total (incl. HST)</th><th></th></tr></thead><tbody>' +
    cmpRows(x) + "</tbody></table></div></td></tr>";
}

/* keep --abh equal to the app bar's real height so the sticky nav sits right under it */
function measureAppbar() {
  var ab = document.querySelector(".appbar");
  if (ab) document.documentElement.style.setProperty("--abh", ab.offsetHeight + "px");
}
window.addEventListener("resize", measureAppbar);

var spyObserver = null;
function setupScrollSpy() {
  measureAppbar();
  if (spyObserver) { spyObserver.disconnect(); spyObserver = null; }
  var links = {};
  document.querySelectorAll(".secnav a").forEach(function (a) {
    links[a.getAttribute("href").slice(1)] = a;
  });
  var current = null;
  spyObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        if (current) current.classList.remove("active");
        current = links[en.target.id] || null;
        if (current) current.classList.add("active");
      }
    });
  }, { rootMargin: "-35% 0px -55% 0px" });
  document.querySelectorAll("#report section[id]").forEach(function (s) { spyObserver.observe(s); });
}

function aiStatus(t) { var el = document.getElementById("aiStatus"); if (el) el.textContent = t; }

function aiBuildStats() {
  var d = computeAll();
  var jobsBrief = d.jobs.map(function (x) {
    return { no: x.j.no, job: x.j.desc, priority: !!x.j.priority,
      carried_cost_cad: Math.round(x.c.cost * 100) / 100,
      bids: x.j.bids.length, pending_bids_from: x.c.pendingNames,
      savings_vs_next_bid_cad: x.c.saving || 0 };
  });
  var roll = Object.keys(d.roll).map(function (nm) {
    return { contractor: nm, jobs: d.roll[nm].n, total_cad: Math.round(d.roll[nm].tot * 100) / 100 };
  }).sort(function (a, b) { return b.total_cad - a.total_cad; });
  return { condominium: state.meta.condoName, registration: state.meta.regNo,
    manager: state.meta.manager, buildings: state.meta.buildings,
    totals: { all_jobs_cad: Math.round(d.total * 100) / 100, jobs: d.jobs.length,
      high_priority_jobs: d.hp.length, high_priority_cad: Math.round(d.hpTotal * 100) / 100,
      savings_from_competitive_bids_cad: Math.round(d.savings * 100) / 100,
      bids_pending: d.pendingCount },
    spend_by_contractor: roll, jobs: jobsBrief };
}
function aiGenerate() {
  if (!cloud.fns) { aiStatus("⚠ Cloud Functions unavailable in this copy."); return; }
  if (!cloud.user) { aiStatus("Sign in first (click Edit data and sign in with Google)."); return; }
  aiStatus("Claude is writing… (a few seconds)");
  cloud.fns.httpsCallable("nnsccTrackerAi")({ stats: aiBuildStats() })
    .then(function (res) {
      var d = res.data || {};
      state.ai = { summary: d.summary, spendNote: d.spendNote, openNote: d.openNote,
        generatedAt: new Date().toISOString(), generatedBy: (cloud.user && cloud.user.email) || "" };
      persist(); renderEditor(); renderReport();
      aiStatus("Done — review the text below, then check the Report tab.");
    })
    .catch(function (e) {
      var code = (e && e.code) || "";
      if (code === "functions/failed-precondition") aiStatus("⚠ " + e.message);
      else if (code === "functions/permission-denied") aiStatus("⚠ This account is not an editor.");
      else if (code === "functions/unauthenticated") aiStatus("Sign in first, then try again.");
      else aiStatus("⚠ " + ((e && e.message) || "generation failed"));
    });
}
function aiSaveKey() {
  var inp = document.getElementById("aiKeyInput");
  var v = (inp.value || "").trim();
  if (!v) { aiStatus("Paste a key first."); return; }
  cloud.db.doc(CONFIG_PATH).set({ anthropicKey: v }, { merge: true }).then(function () {
    inp.value = ""; aiKeyState = "set"; aiShowKeyRow = false; renderEditor();
    aiStatus("Key saved server-side. It can never be read back by a browser.");
  }).catch(function (e) {
    aiStatus(e && e.code === "permission-denied"
      ? "⚠ Only the owner account can save the key." : "⚠ Could not save key.");
  });
}

/* ---------- editor events (delegated) ---------- */
document.getElementById("editor").addEventListener("change", function (e) {
  var aif = e.target.dataset.aif;
  if (aif && state.ai) {
    state.ai[aif] = e.target.value;
    persist(); renderReport(); return;
  }
  var mf = e.target.dataset.mf;
  if (mf) {
    state.meta = state.meta || Object.assign({}, META_DEFAULTS);

    persist(); renderReport(); return;
  }
  var card = e.target.closest(".ecard"); if (!card) return;
  var j = state.jobs[+card.dataset.ji]; if (!j) return;
  var f = e.target.dataset.f; if (!f) return;
  var row = e.target.closest(".ebrow");
  if (f === "priority") {
    j.priority = e.target.checked;
    orderJobs(state.jobs);   /* priority jobs move to the front, renumber */
    persist(); renderEditor(); renderReport();
    return;
  }
  else if (f === "desc") j.desc = e.target.value;
  else if (row) {
    var b = j.bids[+row.dataset.bi]; if (!b) return;
    if (f === "amount") b.amount = e.target.value === "" ? null : Number(e.target.value);
    else if (f === "hst") b.hst = e.target.value === "yes";
    else b[f] = e.target.value;
  }
  persist(); renderEditor(); renderReport();
});
document.getElementById("editor").addEventListener("click", function (e) {
  if (e.target.id === "btnAddJob") {
    var nj = { id: genId(), no: 0, priority: false, desc: "",
      bids: [{ contractor: "", qno: "", amount: null, hst: false, notes: "" }] };
    state.jobs.push(nj);
    orderJobs(state.jobs);   /* lands at the end of the standard jobs */
    persist(); renderEditor(); renderReport();
    var added = document.querySelector('#editor .ecard[data-jid="' + nj.id + '"]');
    if (added) { added.scrollIntoView({ block: "center" }); var di = added.querySelector(".desc"); if (di) di.focus(); }
    return;
  }
  /* move a job up or down within its priority group */
  if (e.target.dataset.act === "moveup" || e.target.dataset.act === "movedn") {
    var mc = e.target.closest(".ecard"); if (!mc) return;
    var mi = +mc.dataset.ji, mj = state.jobs[mi];
    var dir = e.target.dataset.act === "moveup" ? -1 : 1;
    var nb = state.jobs[mi + dir];
    if (!nb || !!nb.priority !== !!mj.priority) return;   /* stay within the same group */
    state.jobs[mi] = nb; state.jobs[mi + dir] = mj;
    orderJobs(state.jobs);
    persist(null, ['Moved “' + (mj.desc || "job") + '” ' + (dir < 0 ? "up" : "down")]);
    renderEditor(); renderReport();
    var moved = document.querySelector('#editor .ecard[data-jid="' + mj.id + '"]');
    if (moved) moved.scrollIntoView({ block: "nearest" });
    return;
  }
  var act = e.target.dataset.act; if (!act) return;
  if (act === "ai-savekey") { aiSaveKey(); return; }
  if (act === "ai-replacekey") { aiShowKeyRow = true; renderEditor(); return; }
  if (act === "ai-generate") { aiGenerate(); return; }
  if (act === "ai-remove") {
    state.ai = null; persist(); renderEditor(); renderReport(); return;
  }
  var card = e.target.closest(".ecard"); if (!card) return;
  var ji = +card.dataset.ji, j = state.jobs[ji];
  if (act === "addbid") j.bids.push({ contractor: "", qno: "", amount: null, hst: false, notes: "" });
  else if (act === "delbid") {
    var row = e.target.closest(".ebrow");
    j.bids.splice(+row.dataset.bi, 1);
  } else if (act === "deljob") {
    /* two-step delete: first click arms the button, second click within 4s deletes */
    if (e.target.dataset.armed !== "1") {
      e.target.dataset.armed = "1";
      e.target.textContent = "Really delete job " + j.no + "?";
      e.target.style.fontWeight = "700";
      setTimeout(function (btn) { return function () {
        btn.dataset.armed = ""; btn.textContent = "✕ job"; btn.style.fontWeight = "";
      }; }(e.target), 4000);
      return;
    }
    state.jobs.splice(ji, 1);
    orderJobs(state.jobs);
  }
  persist(); renderEditor(); renderReport();
});

var dragId = null;
document.getElementById("editor").addEventListener("dragstart", function (e) {
  var handle = e.target.closest(".draghandle"); if (!handle) return;
  var card = handle.closest(".ecard"); if (!card || !card.dataset.jid) return;
  dragId = card.dataset.jid;
  card.classList.add("dragging");
  try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); } catch (er) {}
});
document.getElementById("editor").addEventListener("dragend", function () {
  dragId = null;
  var d = document.querySelector("#editor .ecard.dragging"); if (d) d.classList.remove("dragging");
  var o = document.querySelector("#editor .ecard.dragover"); if (o) o.classList.remove("dragover");
});
document.getElementById("editor").addEventListener("dragover", function (e) {
  if (!dragId) return;
  var card = e.target.closest(".ecard[data-jid]"); if (!card) return;
  e.preventDefault();
  var prev = document.querySelector("#editor .ecard.dragover");
  if (prev && prev !== card) prev.classList.remove("dragover");
  if (card.dataset.jid !== dragId) card.classList.add("dragover");
});
document.getElementById("editor").addEventListener("drop", function (e) {
  if (!dragId) return;
  var card = e.target.closest(".ecard[data-jid]"); if (!card) return;
  e.preventDefault();
  var targetId = card.dataset.jid;
  if (targetId === dragId) return;
  var from = -1, to = -1;
  state.jobs.forEach(function (j, i) { if (j.id === dragId) from = i; if (j.id === targetId) to = i; });
  if (from < 0 || to < 0) return;
  var moved = state.jobs.splice(from, 1)[0];
  if (from < to) to--;                        /* account for the removed element */
  state.jobs.splice(to, 0, moved);
  orderJobs(state.jobs);                       /* re-sort priority-first + renumber */
  persist(null, ['Moved “' + (moved.desc || "job") + '” to position ' + moved.no]);
  renderEditor(); renderReport();
  var m = document.querySelector('#editor .ecard[data-jid="' + moved.id + '"]');
  if (m) m.scrollIntoView({ block: "nearest" });
});

/* ---------- PIN gate ---------- */
var PIN_HASH = "d76b56c1";           /* FNV-1a of the PIN; not the PIN itself */
var UNLOCK_KEY = "nnscc-qt-unlocked";
function fnv1a(s) {
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ("0000000" + h.toString(16)).slice(-8);
}
var pinCb = null;
function askPin(opts, cb) {
  /* opts: {title, msg, warn, always} — `always` ignores the session unlock */
  if (!opts.always) {
    try { if (sessionStorage.getItem(UNLOCK_KEY) === "1") { cb(); return; } } catch (e) {}
  }
  pinCb = { cb: cb, always: !!opts.always };
  document.getElementById("pinTitle").textContent = opts.title || "Enter PIN";
  var m = document.getElementById("pinMsg");
  m.textContent = opts.msg || ""; m.className = opts.warn ? "warn" : "";
  document.getElementById("pinErr").textContent = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("pinOverlay").classList.add("open");
  setTimeout(function(){ document.getElementById("pinInput").focus(); }, 50);
}
function pinClose() { document.getElementById("pinOverlay").classList.remove("open"); pinCb = null; }
function pinTry() {
  var v = document.getElementById("pinInput").value;
  if (fnv1a(v) === PIN_HASH) {
    if (pinCb && !pinCb.always) { try { sessionStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {} }
    var f = pinCb && pinCb.cb; pinClose(); if (f) f();
    if (document.body.dataset.view === "report") renderReport();   /* light up inline heading editing */
  } else {
    document.getElementById("pinErr").textContent = "Wrong PIN — try again.";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
document.getElementById("pinOk").onclick = pinTry;
document.getElementById("pinCancel").onclick = pinClose;
document.getElementById("pinInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") pinTry();
  if (e.key === "Escape") pinClose();
});
document.getElementById("pinOverlay").addEventListener("click", function (e) {
  if (e.target === this) pinClose();
});

/* ---------- change-history panel ---------- */
document.getElementById("btnHistory").onclick = function () {
  var list = document.getElementById("histList");
  document.getElementById("histOverlay").classList.add("open");
  if (!cloud.on) {
    list.innerHTML = '<p class="histempty">History is recorded on the live site (cloud copy) only.</p>';
    return;
  }
  list.innerHTML = '<p class="histempty">Loading…</p>';
  cloud.db.doc(DOC_PATH).collection("audit").orderBy("at", "desc").limit(50).get()
    .then(function (qs) {
      if (qs.empty) { list.innerHTML = '<p class="histempty">No changes recorded yet.</p>'; return; }
      var h = [];
      qs.forEach(function (docSnap) {
        var e = docSnap.data();
        var when = e.at && e.at.toDate ? e.at.toDate().toLocaleString("en-CA") : "";
        h.push('<div class="histentry"><div class="histwho">' + esc(e.by || "unknown") +
          ' <span class="histwhen">· ' + esc(when) + "</span></div><ul>");
        (e.changes || []).forEach(function (c) { h.push("<li>" + esc(c) + "</li>"); });
        h.push("</ul></div>");
      });
      list.innerHTML = h.join("");
    })
    .catch(function (err) {
      list.innerHTML = '<p class="histempty">Could not load history (' + esc(err && err.code || "error") + ').</p>';
    });
};
document.getElementById("histClose").onclick = function () {
  document.getElementById("histOverlay").classList.remove("open");
};
document.getElementById("histOverlay").addEventListener("click", function (e) {
  if (e.target === this) this.classList.remove("open");
});

function offerFile(filename, data) {
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename: filename, data: data })
      .catch(function (err) {
        if (err && err.code === "declined") return;
        alert("Could not save the file (" + (err && err.code || "error") + ").");
      });
  } else {
    var blob = new Blob([data], { type: "application/octet-stream" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
}
document.getElementById("btnBackup").onclick = function () {
  offerFile("quote-tracker-backup-" + new Date().toISOString().slice(0, 10) + ".json",
            JSON.stringify(state, null, 1));
};
document.getElementById("btnRestore").onclick = function () {
  askPin({ title: "Restore backup", msg: "Enter the PIN to replace the current data with a backup file." },
         function () { document.getElementById("fileRestore").click(); });
};
document.getElementById("fileRestore").addEventListener("change", function () {
  var f = this.files[0]; this.value = ""; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.jobs)) throw new Error("bad shape");
      state = normState(d); persist("Backup restored"); renderReport(); renderEditor();
    } catch (e) { alert("That file is not a valid quote-tracker backup."); }
  };
  r.readAsText(f);
});
document.getElementById("btnReset").onclick = function () {
  askPin({ title: "Reset to original", always: true, warn: true,
           msg: "This permanently discards EVERY change saved in this browser and restores the original data. Enter the PIN to continue." },
         function () { state = normState(null); persist("Reset to original data"); renderReport(); renderEditor(); });
};
var portableBtn = document.getElementById("btnPortable");
if (window.claude && window.claude.downloads) {
  portableBtn.style.display = "none"; /* .html not saveable from the artifact viewer */
} else {
  portableBtn.onclick = function () {
    /* embed the current data as the new seed, then serialize the whole document */
    document.getElementById("seed").textContent = JSON.stringify(state);
    offerFile("quote-tracker.html", "<!doctype html>\n" + document.documentElement.outerHTML);
  };
}

/* ---------- go ---------- */
lastSaved = deepCopy(state);
cloudInit();
setView("report");
})();
</script>
